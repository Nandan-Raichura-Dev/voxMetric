<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxMetric - History</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Bg  Glow -->
  <div class="particles-container">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <button id="logoutBtn" class="signout-btn">Sign Out</button>
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v18M8 6v12M4 9v6M16 6v12M20 9v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">Vox<span>Metric</span></span>
      </a>

      <nav class="nav">
            <a href="index.html" class="nav-link">Practice</a>
            <a href="progress.html" class="nav-link">Progress & Streaks</a>
            <a href="history.html" class="nav-link active">History</a>
            <a href="about-us.html" class="nav-link">About Us</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="main-content">
    <div class="history-container">
      
      <div class="page-header">
            <h1 class="page-title">Speech History</h1>
            <p class="page-subtitle">Review your recorded practice sessions and metrics.</p>
      </div>

      <!-- Overview Summary Cards -->
      <div class="analytics-grid">
            <div class="report-card">
            <span class="report-title">Total Sessions</span>
            <div id="totalCount" class="report-value">0</div>
            </div>
            <div class="report-card">
            <span class="report-title">Avg Clarity</span>
            <div id="avgClarity" class="report-value">0%</div>
            </div>
            <div class="report-card">
            <span class="report-title">Total Fillers</span>
            <div id="totalFillers" class="report-value">0</div>
            </div>
      </div>

      <!-- History Log Card -->
      <div class="transcript-card">
            <div class="card-header">
            <span class="card-title">Recorded Speeches</span>
            <span id="sessionBadge" class="badge">0 Sessions</span>
            </div>
            
            <div id="historyList" class="history-list">
            <p class="placeholder-text">Loading your speech history...</p>
            </div>
      </div>

    </div>
  </main>

  <!-- footer -->
  <footer class="footer">
    <div class="footer-container">
      <p>&copy; 2026 VoxMetric. All rights reserved.</p>
    </div>
  </footer>

  <!--  js Module -->
  <script type="module" src="history.js"></script>
</body>
</html>
