<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxMetric - Account</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
   
    <div class="auth-header">
      <a href="#" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v18M8 6v12M4 9v6M16 6v12M20 9v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">Vox<span>Metric</span></span>
      </a>
      <p>Log in or create an account to start practicing</p>
    </div>

   
    <div class="auth-tabs">
      <button type="button" id="loginTabBtn" class="tab-link active">Log In</button>
      <button type="button" id="signupTabBtn" class="tab-link">Sign Up</button>
    </div>

   
    <div id="authNotice" class="auth-notice hidden"></div>

  
    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" class="primary-btn">Log In</button>
    </form>

    <form id="signupForm" class="auth-form hidden">
      <div class="form-group">
        <label for="signupName">Name</label>
        <input type="text" id="signupName" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Minimum 6 characters" minlength="6" required>
      </div>

      <button type="submit" class="primary-btn">Create Account</button>
    </form>

  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
